--name "SGM Studios"
--about README.md
--amend
--commit-template "index: $changelog

[ci skip]"

; Metadata links shown in ReaPack's package browser.
; `--link` defaults to rel="website"; the others set rel="screenshot" / "donation".
; index.xml is currently maintained by tools/gen_index.py (reapack-index needs
; Ruby, nokogiri and pandoc, none of which are available in CI here). These flags
; are what to run if the index is ever regenerated with the official tool:
--link https://github.com/sgm-audio/sgm-studios-reapack
--screenshot-link https://github.com/sgm-audio/sgm-studios-reapack/raw/main/docs/screenshots/SGM_auto_master.lua.png

; Donation link: set one, then uncomment. ReaPack turns it into a Donate button.
;--donation-link https://example.com/support
